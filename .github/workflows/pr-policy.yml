name: PR Policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, assigned, unassigned, ready_for_review]
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/^(feature|bugfix)\/INS-(\d+)-[a-z0-9]+(?:-[a-z0-9]+)*$/);
            if (!match) return core.setFailed('Use feature/INS-<issue>-description or bugfix/INS-<issue>-description.');
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(match[2]) });
            if (issue.pull_request || issue.state !== 'open') core.setFailed('The branch must reference an open task issue.');
  validate-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INS_PROJECT_TOKEN }}
          script: |
            // Metadata only: never check out or execute PR code with this token.
            const match = context.payload.pull_request.head.ref.match(/^(feature|bugfix)\/INS-(\d+)-/);
            if (!match) return core.setFailed('Missing INS ticket.');
            for (let attempt = 0; attempt < 6; attempt++) {
              const result = await github.graphql(`query($owner:String!, $repo:String!, $pr:Int!, $issue:Int!) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$pr) { assignees(first:100) { nodes { login } } projectItems(first:100) { nodes { project { id } } } }
                  issue(number:$issue) { assignees(first:100) { nodes { login } } projectItems(first:100) { nodes { project { id } } } }
                }
              }`, { ...context.repo, pr: context.payload.pull_request.number, issue: Number(match[2]) });
              const valid = [result.repository.pullRequest, result.repository.issue].every(item =>
                item.assignees.nodes.some(a => a.login === 'altayince') &&
                item.projectItems.nodes.some(p => p.project?.id === 'PVT_kwHOAe6Zy84BkwMu'));
              if (valid) return;
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Both the issue and PR must be assigned to altayince and belong to the private INS Project.');
